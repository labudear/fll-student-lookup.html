<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Student Lookup (Google Drive)</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body { font-family: Arial; margin: 30px; }
    #rowData { margin-top: 20px; border: 1px solid #ccc; padding: 15px; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; }
    #message { margin-top: 10px; color: #b00; }
    #info { margin-top: 10px; color: #333; font-size: 0.9em; }
    button { margin-left: 10px; }
  </style>
</head>

<body>

<h2>Student Information Viewer</h2>

<p>Type the student's name (case-insensitive):</p>
<input type="text" id="studentInput" placeholder="Enter student name">
<button id="searchBtn">Search</button>
<button id="refreshBtn">Refresh Data</button>

<div id="message"></div>
<div id="info"></div>
<div id="rowData"></div>

<!-- Weekly Snack Provider Card -->
<div class="card">
  <div class="week">
    <div class="label">Last Week's Snack Provider</div>
    <div class="name" id="lastWeek"></div>
  </div>

  <div class="week">
    <div class="label">This Week's Snack Provider</div>
    <div class="name" id="thisWeek"></div>
  </div>

  <div id="date"></div>
</div>

<script>
// GitHub raw image base URL
// Replace with your actual GitHub repo path
const githubBase = "https://raw.githubusercontent.com/labudear/fll-student-lookup/main/";

const driveURL = "https://docs.google.com/spreadsheets/d/1DF7ZBAfByHIIY-gyTHCBRwXx52Wt-QDB/export?format=xlsx";

let excelData = [];

// Load Excel from Google Drive
function loadExcel() {
  const messageDiv = document.getElementById("message");
  const infoDiv = document.getElementById("info");
  messageDiv.textContent = "Loading data...";
  infoDiv.textContent = "";
  excelData = [];

  fetch(driveURL)
    .then(res => res.arrayBuffer())
    .then(buffer => {
      let workbook = XLSX.read(buffer, { type: "array" });

      let sheetName = workbook.SheetNames.find(n => n.trim().toLowerCase() === "sheet1");

      if (!sheetName) {
        sheetName = workbook.SheetNames[0];
        messageDiv.textContent = 'Sheet1 not found; using first sheet: "' + sheetName + '"';
      } else {
        messageDiv.textContent = 'Using sheet: "' + sheetName + '"';
      }

      let sheet = workbook.Sheets[sheetName];
      excelData = XLSX.utils.sheet_to_json(sheet);

      infoDiv.innerHTML = "Rows loaded: " + excelData.length;

    })
    .catch(err => {
      messageDiv.textContent = "Error loading Excel file.";
      console.error(err);
    });
}

// Initial load
loadExcel();

// Refresh button
document.getElementById("refreshBtn").addEventListener("click", function() {
  loadExcel();
});

// Search button
document.getElementById("searchBtn").addEventListener("click", function() {
  let name = document.getElementById("studentInput").value.trim().toLowerCase();
  let messageDiv = document.getElementById("message");
  let rowDiv = document.getElementById("rowData");

  messageDiv.textContent = "";
  rowDiv.innerHTML = "";

  if (!name) {
    messageDiv.textContent = "Please enter a student name.";
    return;
  }

  if (!excelData.length) {
    messageDiv.textContent = "No data loaded yet. Click Refresh Data.";
    return;
  }

  let row = excelData.find(r =>
    String(r.Student || "").trim().toLowerCase() === name
  );

  if (!row) {
    messageDiv.textContent = "No student found with that name.";
    return;
  }

  // Build HTML with dynamic GitHub image
  let html = `
    <h3>Student Details</h3>
    <table>
      <tr><th>Field</th><th>Value</th></tr>
      <tr><td>Parent</td><td>${row.Parent || ""}</td></tr>
      <tr><td>City</td><td>${row.City || ""}</td></tr>
      <tr><td>Host</td><td>${row.Host || ""}</td></tr>
      <tr><td>Grade</td><td>${row.Grade || ""}</td></tr>

      <tr>
        <td>Team</td>
        <td>
          ${row.Team || ""}
          ${row.Imagename ? `
            <img src="${githubBase + row.Imagename}"
                 alt="Team Image"
                 style="width:100px; height:100px; margin-left:10px; vertical-align:middle;">
          ` : ""}
        </td>
      </tr>

      <tr><td>TeamNumber</td><td>${row.TeamNumber || ""}</td></tr>
      <tr><td>Coach1</td><td>${row.Coach1 || ""}</td></tr>
      <tr><td>Coach2</td><td>${row.Coach2 || ""}</td></tr>
      <tr><td>Mentors</td><td>${row.Mentors || ""}</td></tr>
      <tr><td>Status</td><td>${row.Status || ""}</td></tr>
      <tr><td>Schedule</td><td>${row.Schedule || ""}</td></tr>
      <tr><td>ClassAddress</td><td>${row.ClassAddress || ""}</td></tr>
    </table>
  `;

  rowDiv.innerHTML = html;
});
// Weekly Snack Provider logic (dynamic from Excel)
function updateSnackSchedule() {
  if (!excelData.length) return;

  // Filter rows where Grade (E:E) is not missing
  const validRows = excelData.filter(r => r.Grade && r.Team && r.Parent);

  // Extract names from column D (Parent) and team from F (Team)
  const names = validRows.map(r => ({
    name: r.Parent,
    team: r.Team
  }));

  if (!names.length) {
    document.getElementById("thisWeek").textContent = "No valid data";
    document.getElementById("lastWeek").textContent = "";
    return;
  }

  // Cycle starts October 1, 2026
  const startDate = new Date("2026-10-01T00:00:00");
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const daysPassed = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));
  const currentWeek = Math.floor(daysPassed / 7);

  const thisWeekIndex = ((currentWeek % names.length) + names.length) % names.length;
  const lastWeekIndex = (((currentWeek - 1) % names.length) + names.length) % names.length;

  // Display names and teams
  document.getElementById("thisWeek").textContent =
    `${names[thisWeekIndex].name} (${names[thisWeekIndex].team})`;

  document.getElementById("lastWeek").textContent =
    `${names[lastWeekIndex].name} (${names[lastWeekIndex].team})`;

  document.getElementById("date").textContent =
    "Today: " + today.toLocaleDateString();
}

// Call after Excel loads
function loadExcel() {
  const messageDiv = document.getElementById("message");
  const infoDiv = document.getElementById("info");
  messageDiv.textContent = "Loading data...";
  infoDiv.textContent = "";
  excelData = [];

  fetch(driveURL)
    .then(res => res.arrayBuffer())
    .then(buffer => {
      let workbook = XLSX.read(buffer, { type: "array" });
      let sheetName = workbook.SheetNames.find(n => n.trim().toLowerCase() === "sheet1");
      if (!sheetName) sheetName = workbook.SheetNames[0];
      let sheet = workbook.Sheets[sheetName];
      excelData = XLSX.utils.sheet_to_json(sheet);
      infoDiv.innerHTML = "Rows loaded: " + excelData.length;

      // Update snack schedule dynamically
      updateSnackSchedule();
    })
    .catch(err => {
      messageDiv.textContent = "Error loading Excel file.";
      console.error(err);
    });
}
  </script>

</body>
</html>
