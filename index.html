<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Student Lookup (Google Drive)</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body { 
      font-family: Arial; 
      margin: 30px; 
      background: #f2f2f2;
    }

    #rowData { 
      margin-top: 20px; 
      border: 1px solid #ccc; 
      padding: 15px; 
      background: #fff;
      border-radius: 10px;
    }

    table { 
      border-collapse: collapse; 
      width: 100%; 
      margin-top: 10px; 
    }

    th, td { 
      border: 1px solid #ccc; 
      padding: 8px; 
    }

    #message { margin-top: 10px; color: #b00; }
    #info { margin-top: 10px; color: #333; font-size: 0.9em; }
    button { margin-left: 10px; }

    /* Snack card styling */
    .card {
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      text-align: center;
    }

    .week {
      margin: 20px 0;
      padding: 20px;
      border-radius: 15px;
      background: #f8f8f8;
    }

    .label {
      font-size: 20px;
      color: #555;
      margin-bottom: 10px;
    }

    .name {
      font-size: 32px;
      font-weight: bold;
      line-height: 1.3;
    }

    #date {
      color: #777;
      margin-top: 25px;
    }
  </style>
</head>

<body>

<h2>Student Information Viewer</h2>

<p>Type the student's name (case-insensitive):</p>
<input type="text" id="studentInput" placeholder="Enter student name">
<button id="searchBtn">Search</button>
<button id="refreshBtn">Refresh Data</button>

<div id="message"></div>
<div id="info"></div>
<div id="rowData"></div>

<!-- Weekly Snack Provider Card -->
<div class="card">
  <div class="week">
    <div class="label">Last Week's Snack Provider</div>
    <div class="name" id="lastWeek"></div>
  </div>

  <div class="week">
    <div class="label">This Week's Snack Provider</div>
    <div class="name" id="thisWeek"></div>
  </div>

  <div id="date"></div>
</div>

<script>
// GitHub raw image base URL
const githubBase = "https://raw.githubusercontent.com/labudear/fll-student-lookup/main/";
const driveURL = "https://docs.google.com/spreadsheets/d/1DF7ZBAfByHIIY-gyTHCBRwXx52Wt-QDB/export?format=xlsx";

let excelData = [];

// Load Excel from Google Drive
function loadExcel() {
  const messageDiv = document.getElementById("message");
  const infoDiv = document.getElementById("info");
  messageDiv.textContent = "Loading data...";
  infoDiv.textContent = "";
  excelData = [];

  fetch(driveURL)
    .then(res => res.arrayBuffer())
    .then(buffer => {
      let workbook = XLSX.read(buffer, { type: "array" });
      let sheetName = workbook.SheetNames.find(n => n.trim().toLowerCase() === "sheet1");
      if (!sheetName) sheetName = workbook.SheetNames[0];
      let sheet = workbook.Sheets[sheetName];
      excelData = XLSX.utils.sheet_to_json(sheet);
      infoDiv.innerHTML = "Rows loaded: " + excelData.length;
    })
    .catch(err => {
      messageDiv.textContent = "Error loading Excel file.";
      console.error(err);
    });
}

// Initial load
loadExcel();

// Refresh button
document.getElementById("refreshBtn").addEventListener("click", loadExcel);

// Search button
document.getElementById("searchBtn").addEventListener("click", function() {
  let name = document.getElementById("studentInput").value.trim().toLowerCase();
  let messageDiv = document.getElementById("message");
  let rowDiv = document.getElementById("rowData");

  messageDiv.textContent = "";
  rowDiv.innerHTML = "";

  if (!name) {
    messageDiv.textContent = "Please enter a student name.";
    return;
  }

  if (!excelData.length) {
    messageDiv.textContent = "No data loaded yet. Click Refresh Data.";
    return;
  }

  let row = excelData.find(r =>
    String(r.Student || "").trim().toLowerCase() === name
  );

  if (!row) {
    messageDiv.textContent = "No student found with that name.";
    return;
  }

  let html = `
    <h3>Student Details</h3>
    <table>
      <tr><th>Field</th><th>Value</th></tr>
      <tr><td>Parent</td><td>${row.Parent || ""}</td></tr>
      <tr><td>City</td><td>${row.City || ""}</td></tr>
      <tr><td>Host</td><td>${row.Host || ""}</td></tr>
      <tr><td>Grade</td><td>${row.Grade || ""}</td></tr>
      <tr><td>Team</td><td>${row.Team || ""}</td></tr>
      <tr><td>SnackSchedule</td><td>${row.SnackSchedule || ""}</td></tr>
    </table>
  `;
  rowDiv.innerHTML = html;

  // Show snack schedule for this student's team
  updateSnackSchedule(row.Team);
});

// Weekly Snack Provider logic using FIXED team lists
function updateSnackSchedule(studentTeam) {

  // Step 1: Hard-coded provider lists by team (from your message)
  const providerLists = {
    "Explore-1 (Himalayan Robotics)": [
      "Ram", "Shyam", "Hari", "Gopal", "Ganesh"
    ],
    "Explore-2 (Kopila Robotics)": [
      "Gopal", "Hari", "Shyam", "Krishna", "Ram", "Ganesh"
    ],
    "Explore-3 (Everest Robotics)": [
      "A", "Shyam", "d", "f", "g", "Hari"
    ],
    "Challenge-1 (Rhino Robotics)": [
      "w", "Ram", "t", "y", "u", "Krishna", "Ganesh"
    ],
    "Challenge-2 (Yeti Robotics)": [
      "t", "y", "Shyam", "d", "f", "g", "t"
    ]
  };

  // Step 2: Get provider list for the student's team
  const providers = providerLists[studentTeam];

  if (!providers) {
    document.getElementById("thisWeek").textContent = "No provider list found";
    document.getElementById("lastWeek").textContent = "";
    return;
  }

  // Step 3: Weekly rotation math
  const startDate = new Date("2026-10-01T00:00:00");
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const daysPassed = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));
  const currentWeek = Math.floor(daysPassed / 7);

  const thisIndex = ((currentWeek % providers.length) + providers.length) % providers.length;
  const lastIndex = (((currentWeek - 1) % providers.length) + providers.length) % providers.length;

  const thisProvider = providers[thisIndex];
  const lastProvider = providers[lastIndex];

  // Step 4: Display results
  document.getElementById("thisWeek").textContent = `${studentTeam} — ${thisProvider}`;
  document.getElementById("lastWeek").textContent = `${studentTeam} — ${lastProvider}`;
  document.getElementById("date").textContent = "Today: " + today.toLocaleDateString();
}

</script>

</body>
</html>
